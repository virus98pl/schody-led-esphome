# =====================================================================
#  SCHODY – czujnik VL53L5CX (wspólna część dla schody-dol i schody-gora)
#  ESP32-C3 SuperMini + VL53L5CX (I2C), w obudowie podtynkowej w stopniu.
#  Ruch wysyła do sterownika po UDP (packet_transport) i do HA (API).
# =====================================================================

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}-awaryjny"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80

external_components:
  - source:
      type: local
      path: components
    components: [vl53l5cx_presence]

vl53l5cx_presence:
  id: tof
  sda: ${sda}
  scl: ${scl}
  frequency: 400000
  resolution: 8          # 8x8 stref, maks. 15 Hz
  ranging_hz: 10
  margin: 200            # strefa „widzi ruch”, gdy coś jest o tyle bliżej niż tło [mm]
  max_distance: 1500     # dalej niż tyle nie patrzymy [mm]
  min_zones: 2           # ile stref naraz musi widzieć ruch
  frames_on: 2           # ile ramek z rzędu, żeby włączyć (2 ramki = 0,2 s)
  frames_off: 10         # ile ramek bez ruchu, żeby wyłączyć (1 s)
  presence:
    id: ruch
    name: "Ruch"
  distance:
    name: "Odległość"
  zones:
    name: "Strefy z ruchem"
    entity_category: diagnostic

udp:
  - id: udp_bus

packet_transport:
  - platform: udp
    udp_id: udp_bus
    binary_sensors:
      - ruch

number:
  - platform: template
    name: "Czułość – margines"
    icon: mdi:tune-vertical
    unit_of_measurement: mm
    min_value: 50
    max_value: 1000
    step: 10
    initial_value: 200
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(tof).set_margin((int) x);

  - platform: template
    name: "Zasięg maks."
    icon: mdi:arrow-expand-horizontal
    unit_of_measurement: mm
    min_value: 300
    max_value: 4000
    step: 50
    initial_value: 1500
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(tof).set_max_distance((int) x);

  - platform: template
    name: "Min. liczba stref"
    icon: mdi:grid
    min_value: 1
    max_value: 16
    step: 1
    initial_value: 2
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: id(tof).set_min_zones((int) x);

button:
  - platform: template
    name: "Kalibruj puste schody"
    icon: mdi:target
    entity_category: config
    on_press:
      - lambda: id(tof).calibrate();

  - platform: template
    name: "Usuń kalibrację"
    icon: mdi:target-variant
    entity_category: config
    on_press:
      - lambda: id(tof).clear_calibration();

  - platform: restart
    name: "Restart"

sensor:
  - platform: wifi_signal
    name: "Sygnał Wi-Fi"
    update_interval: 60s
  - platform: uptime
    name: "Czas pracy"
