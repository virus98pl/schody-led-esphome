# Czujnik schodowy – pierwszy stopień
# Nazwa urządzenia (schody-dol) musi się zgadzać z listą providers w schody-sterownik.yaml.
substitutions:
  name: schody-dol
  friendly_name: Schody czujnik dół
  sda: "21"    # ESP32 DevKit V1: GPIO21 = SDA (D21)
  scl: "22"    # GPIO22 = SCL (D22)

packages:
  czujnik: !include czujnik_wspolny.yaml
