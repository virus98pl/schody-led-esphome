# Czujnik schodowy – ostatni stopień / podest
# Nazwa urządzenia (schody-gora) musi się zgadzać z listą providers w schody-sterownik.yaml.
substitutions:
  name: schody-gora
  friendly_name: Schody czujnik góra
  sda: "6"     # ESP32-C3 SuperMini: GPIO6 = SDA
  scl: "7"     # GPIO7 = SCL

packages:
  czujnik: !include czujnik_wspolny.yaml
